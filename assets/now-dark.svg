@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s infinite ease-in-out}</style><g clip-path="url(#clip)"><rect width="1200" height="210" rx="26" class="bg"/><circle cx="61" cy="58" r="5" class="acc"/><text x="76" y="63" class="f-monom ink" font-size="13" letter-spacing="2">BUILDING</text><text x="56" y="112" class="f-serif ink" font-size="24">PreCourier into a decision engine</text><text x="56" y="140" class="f-serif ink" font-size="24">a real brand could run.</text><circle cx="424" cy="58" r="5" class="acc"/><text x="439" y="63" class="f-monom ink" font-size="13" letter-spacing="2">PRACTISING</text><text x="419" y="112" class="f-serif ink" font-size="24">DSA in C++ every week,</text><text x="419" y="140" class="f-serif ink" font-size="24">synced to GitHub from LeetCode.</text><line x1="391" y1="44" x2="391" y2="170" class="line"/><circle cx="786" cy="58" r="5" class="pine pulse"/><text x="801" y="63" class="f-monom ink" font-size="13" letter-spacing="2">OPEN TO</text><text x="781" y="112" class="f-serif ink" font-size="24">full-time roles, freelance work</text><text x="781" y="140" class="f-serif ink" font-size="24">and good collaborations.</text><line x1="753" y1="44" x2="753" y2="170" class="line"/><rect width="1200" height="210" rx="26" filter="url(#grain)" style="opacity:var(--grain)"/></g><rect x=".75" y=".75" width="1198.5" height="208.5" rx="25.25" fill="none" class="line" stroke-width="1.5"/></svg>
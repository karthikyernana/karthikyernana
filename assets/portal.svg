<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" fill="none">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#16233B"/><stop offset=".55" stop-color="#090D16"/><stop offset="1" stop-color="#03050A"/></radialGradient>
  <linearGradient id="line" x1="180" y1="60" x2="1020" y2="370"><stop stop-color="#69EACB" stop-opacity="0"/><stop offset=".45" stop-color="#69EACB"/><stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="orb" x1="430" y1="100" x2="780" y2="330"><stop stop-color="#6EE7D1"/><stop offset=".5" stop-color="#7C6CFF"/><stop offset="1" stop-color="#FF6BD6"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#B8C7E6" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="430" rx="28" fill="url(#bg)"/>
<rect width="1200" height="430" rx="28" fill="url(#grid)"/>
<circle cx="170" cy="120" r="90" fill="#4DE1C1" fill-opacity=".12" filter="url(#blur)">
  <animate attributeName="cx" values="170;230;170" dur="9s" repeatCount="indefinite"/>
</circle>
<circle cx="1030" cy="310" r="110" fill="#7567FF" fill-opacity=".12" filter="url(#blur)">
  <animate attributeName="cy" values="310;250;310" dur="11s" repeatCount="indefinite"/>
</circle>
<g opacity=".55" stroke="url(#line)">
  <ellipse cx="600" cy="215" rx="255" ry="105" transform="rotate(-17 600 215)"/>
  <ellipse cx="600" cy="215" rx="255" ry="105" transform="rotate(17 600 215)"/>
  <ellipse cx="600" cy="215" rx="185" ry="75"/>
</g>
<g filter="url(#glow)">
  <circle cx="600" cy="215" r="82" fill="#050914" stroke="url(#orb)" stroke-width="2"/>
  <circle cx="600" cy="215" r="67" fill="#0B1324" stroke="#69EACB" stroke-opacity=".3"/>
  <circle cx="600" cy="215" r="5" fill="#D8FFF7">
    <animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</g>
<g fill="#C7D2E9">
  <circle cx="330" cy="114" r="2"/><circle cx="870" cy="102" r="2"/><circle cx="920" cy="275" r="1.5"/><circle cx="255" cy="285" r="1.5"/><circle cx="780" cy="350" r="2"/>
</g>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
  <text x="600" y="168" fill="#91A2BF" font-size="13" letter-spacing="5">KARTHIK YERNANA</text>
  <text x="600" y="215" fill="#F4F7FF" font-size="34" font-weight="700" letter-spacing="-1">building things that think</text>
  <text x="600" y="247" fill="#A8B5CB" font-size="14">full-stack engineering · systems · product · applied AI</text>
  <text x="600" y="303" fill="#69EACB" font-size="11" letter-spacing="3">ENTER THE WORKSPACE</text>
</g>
<path d="M470 320H730" stroke="url(#line)" stroke-width="1"/>
<circle cx="470" cy="320" r="2" fill="#69EACB"><animate attributeName="cx" values="470;730;470" dur="6s" repeatCount="indefinite"/></circle>
</svg>
